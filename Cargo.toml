# ABOUTME: Workspace root for dravr-channels unified multi-platform messaging
# ABOUTME: Three crates: core library, MCP server library, and unified REST+MCP server binary

[workspace]
members = [".", "crates/dravr-channels-mcp", "crates/dravr-channels-server"]

[package]
name = "dravr-channels"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified multi-platform messaging library for WhatsApp, Slack, Discord, Telegram, and Messenger"
repository = "https://github.com/dravr-ai/dravr-channels"
homepage = "https://github.com/dravr-ai/dravr-channels"
documentation = "https://docs.rs/dravr-channels"
keywords = ["messaging", "whatsapp", "slack", "discord", "telegram"]
categories = ["api-bindings", "web-programming::http-server"]
readme = "README.md"
exclude = [".claude/", ".githooks/", ".github/", "scripts/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
channel-whatsapp = []
channel-messenger = []
channel-discord = ["dep:ed25519-dalek"]
channel-slack = []
channel-telegram = []
all-channels = ["channel-whatsapp", "channel-messenger", "channel-discord", "channel-slack", "channel-telegram"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
http = "1.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"
html-escape = "0.2"
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }
thiserror = "2"

# Discord Ed25519 signature verification
ed25519-dalek = { version = "2.2", optional = true }

[dev-dependencies]
tokio = { version = "1.45", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
redundant_pub_crate = "allow"
multiple_crate_versions = "allow"
