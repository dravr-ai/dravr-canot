# ABOUTME: Workspace root for dravr-canot unified multi-platform messaging
# ABOUTME: Three crates: core library, MCP server library, and unified REST+MCP server binary

[workspace]
members = [".", "crates/dravr-canot-mcp", "crates/dravr-canot-server", "crates/dravr-canot-claude-channel"]

# ============================================================================
# Build Profiles
# ============================================================================

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# ============================================================================
# Workspace Lint Configuration
# ============================================================================
# Shared across all workspace crates via [lints] workspace = true.
# Individual crates inherit these settings automatically.
#
# ZERO TOLERANCE ENFORCEMENT:
#   cargo clippy (reads this config, applies level = "deny")

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Base configuration: Enable clippy lint groups at DENY level
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Error-handling restriction lints — parity with dravr-platform's zero-tolerance policy
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
str_to_string = "deny"


# Type conversion casts - allowed when properly validated
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

# Const fn suggestions - clippy suggests const for methods that can't be const
missing_const_for_fn = "allow"

# Significant drop tightening - false positives with async lock guards
significant_drop_tightening = "allow"

# Module naming - allow repetition for clarity
module_name_repetitions = "allow"

# Enforce `use` imports over inline qualified paths (crate::foo::bar)
# Idiomatic Rust prefers imports at top of file for readability
absolute_paths = "deny"

# Multiple dependency versions - unavoidable in some transitive deps
multiple_crate_versions = "allow"

# Missing errors doc - not all error returns need doc comments
missing_errors_doc = "allow"

# must_use candidate - too noisy for builders and constructors
must_use_candidate = "allow"

# return_self_not_must_use - builder pattern methods
return_self_not_must_use = "allow"

# redundant_pub_crate - explicit visibility is clearer
redundant_pub_crate = "allow"

# ============================================================================
# Package Configuration
# ============================================================================

[package]
name = "dravr-canot"
version = "0.4.19"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified multi-platform messaging library for WhatsApp, Slack, Discord, Telegram, and Messenger"
repository = "https://github.com/dravr-ai/dravr-canot"
homepage = "https://github.com/dravr-ai/dravr-canot"
publish = false
documentation = "https://docs.rs/dravr-canot"
keywords = ["messaging", "whatsapp", "slack", "discord", "telegram"]
categories = ["api-bindings", "web-programming::http-server"]
readme = "README.md"
exclude = [".claude/", ".githooks/", ".github/", "scripts/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
channel-whatsapp = []
channel-messenger = []
channel-discord = ["dep:ed25519-dalek", "dep:tokio-tungstenite", "dep:futures-util", "dep:tokio"]
channel-slack = []
channel-telegram = []
# Enable the AG-UI SSE consumer for rendering pipeline progress to
# channel users (e.g. Telegram status text). See src/agui_consumer.rs.
agui = ["dep:futures-util", "dep:tokio", "reqwest/stream"]
all-channels = ["channel-whatsapp", "channel-messenger", "channel-discord", "channel-slack", "channel-telegram"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
http = "1.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
hex = "0.4"
html-escape = "0.2"
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }
thiserror = "2"

# Discord Ed25519 signature verification
ed25519-dalek = { version = "2.2", optional = true }

# Discord Gateway WebSocket client
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1.45", features = ["rt", "time", "sync", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1.45", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# AG-UI cross-layer E2E tests run a mock SSE server and a mock Telegram
# Bot API in-process via axum. Only used under --features agui.
axum = { version = "0.8", features = ["json", "tokio", "http1"], default-features = false }
futures-util = "0.3"

[lints]
workspace = true

# The Telegram AG-UI demo wires the full SSE → editMessageText loop
# against the live pierre-server AG-UI endpoint. It's a runnable proof
# of the trace behavior that `tests/agui_telegram_e2e.rs` asserts on
# mocks. Feature-gated because it depends on the agui + telegram
# code paths.
[[example]]
name = "telegram_agui_demo"
path = "examples/telegram_agui_demo.rs"
required-features = ["agui", "channel-telegram"]
