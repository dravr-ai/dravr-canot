# ABOUTME: MCP server crate exposing dravr-channels messaging via Model Context Protocol
# ABOUTME: Supports stdio and HTTP/SSE transports with channel management and message sending tools
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

[package]
name = "dravr-channels-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP server for dravr-channels — expose messaging channels via Model Context Protocol"
repository = "https://github.com/dravr-ai/dravr-canot"
keywords = ["mcp", "messaging", "whatsapp", "slack", "discord"]
categories = ["web-programming::http-server"]

[lib]
name = "dravr_channels_mcp"
path = "src/lib.rs"

[[bin]]
name = "dravr-channels-mcp"
path = "src/main.rs"

[features]
default = ["all-channels"]
channel-whatsapp = ["dravr-channels/channel-whatsapp"]
channel-messenger = ["dravr-channels/channel-messenger"]
channel-discord = ["dravr-channels/channel-discord"]
channel-slack = ["dravr-channels/channel-slack"]
channel-telegram = ["dravr-channels/channel-telegram"]
all-channels = ["channel-whatsapp", "channel-messenger", "channel-discord", "channel-slack", "channel-telegram"]

[dependencies]
dravr-channels = { path = "../..", version = "0.1.0" }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.22", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.45", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
redundant_pub_crate = "allow"
multiple_crate_versions = "allow"
