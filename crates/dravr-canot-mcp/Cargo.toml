# ABOUTME: MCP server crate exposing dravr-canot messaging via Model Context Protocol
# ABOUTME: Supports stdio and HTTP/SSE transports with channel management and message sending tools
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

[package]
name = "dravr-canot-mcp"
version = "0.4.28"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP server for dravr-canot — expose messaging channels via Model Context Protocol"
repository = "https://github.com/dravr-ai/dravr-canot"
keywords = ["mcp", "messaging", "whatsapp", "slack", "discord"]
publish = false
categories = ["web-programming::http-server"]
readme = "../../README.md"

[lib]
name = "dravr_canot_mcp"
path = "src/lib.rs"

[[bin]]
name = "dravr-canot-mcp"
path = "src/main.rs"

[features]
default = ["all-channels"]
channel-whatsapp = ["dravr-canot/channel-whatsapp"]
channel-messenger = ["dravr-canot/channel-messenger"]
channel-discord = ["dravr-canot/channel-discord"]
channel-slack = ["dravr-canot/channel-slack"]
channel-telegram = ["dravr-canot/channel-telegram"]
all-channels = ["channel-whatsapp", "channel-messenger", "channel-discord", "channel-slack", "channel-telegram"]

[dependencies]
dravr-canot = { path = "../..", version = "0.4.28" }
dravr-tronc = "0.11.0"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tracing = "0.1"
uuid = { version = "1.22", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.45", features = ["full", "test-util"] }

[lints]
workspace = true
