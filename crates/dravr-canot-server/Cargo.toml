# ABOUTME: Unified REST API + MCP server for dravr-canot messaging
# ABOUTME: Serves webhook endpoints, message sending API, and MCP over HTTP
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

[package]
name = "dravr-canot-server"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified REST API + MCP server for multi-platform messaging"
repository = "https://github.com/dravr-ai/dravr-canot"
keywords = ["messaging", "rest", "mcp", "webhook", "server"]
categories = ["web-programming::http-server"]
readme = "../../README.md"

[lib]
name = "dravr_canot_server"
path = "src/lib.rs"

[[bin]]
name = "dravr-canot-server"
path = "src/main.rs"

[features]
default = ["all-channels"]
channel-whatsapp = ["dravr-canot/channel-whatsapp", "dravr-canot-mcp/channel-whatsapp"]
channel-messenger = ["dravr-canot/channel-messenger", "dravr-canot-mcp/channel-messenger"]
channel-discord = ["dravr-canot/channel-discord", "dravr-canot-mcp/channel-discord"]
channel-slack = ["dravr-canot/channel-slack", "dravr-canot-mcp/channel-slack"]
channel-telegram = ["dravr-canot/channel-telegram", "dravr-canot-mcp/channel-telegram"]
all-channels = ["channel-whatsapp", "channel-messenger", "channel-discord", "channel-slack", "channel-telegram"]

[dependencies]
dravr-canot = { path = "../..", version = "0.4.0" }
dravr-canot-mcp = { path = "../dravr-canot-mcp", version = "0.4.0", default-features = false }
dravr-tronc = { version = "0.2", features = ["notifications"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1.4"
uuid = { version = "1.22", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.45", features = ["full", "test-util"] }

[lints]
workspace = true
